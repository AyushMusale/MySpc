name: myspc
description: "MySpc - Connect. Chat. Belong."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^15.1.2

  # Networking
  dio: ^5.8.0
  socket_io_client: ^3.0.2

  # Dependency injection
  get_it: ^8.0.3

  # Fonts & UI
  google_fonts: ^6.2.1

  # Local storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
